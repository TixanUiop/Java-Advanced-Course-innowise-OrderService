version: '3.9'

services:
  order_service:
    build: .
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local

      SERVER_PORT: 8082

      SPRING_DATASOURCE_URL: jdbc:postgresql://order_db:5432/orderdb
      SPRING_DATASOURCE_USERNAME: order_user
      SPRING_DATASOURCE_PASSWORD: order_password

      USER_SERVICE_URL: http://user-service:8080

      JWT_SECRET: com-innowise-authentication-service-secret-key

    depends_on:
      order_db:
        condition: service_healthy

  order_db:
    image: postgres:15
    container_name: order-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
    ports:
      - "5436:5432"
    volumes:
      - orderdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user"]
      interval: 5s
      retries: 10

volumes:
  orderdb-data:

