services:
  order_db:
    image: postgres:15
    container_name: order-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
    ports:
      - "5436:5432"
    volumes:
      - orderdb-data:/var/lib/postgresql/data

volumes:
  orderdb-data: