name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: orderdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d orderdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/orderdb
      DB_USERNAME: user
      DB_PASSWORD: password
      SPRING_PROFILES_ACTIVE: local
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # ВАЖНО для SonarQube!

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres health
        run: |
          echo "Waiting for Postgres to be ready..."
          for i in {1..30}; do
            if PGPASSWORD=$DB_PASSWORD psql -h localhost -U $DB_USERNAME -d orderdb -c '\q' 2>/dev/null; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Postgres is not ready yet... (attempt $i/30)"
            sleep 2
          done
          echo "Postgres failed to start within timeout"
          exit 1

      - name: Run Tests
        run: mvn clean verify -Pdocker -B

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=TixanUiop_Java-Advanced-Course-innowise-OrderService \
            -Dsonar.organization=tixanuiop \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.coverage.exclusions=**/dto/**,**/entity/**,**/exception/**,**/config/**,**/security/**,**/specification/**

      - name: Build Docker image
        run: docker build -t spring_app:latest .

      - name: Save Docker image
        run: docker save spring_app:latest -o spring_app.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: spring_app.tar